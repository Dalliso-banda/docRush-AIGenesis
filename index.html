<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCRUSH - AI-Powered Patient Engagement</title>
    <style>
        /* General Styles & Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #ffffff; /* White text for contrast */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden; /* Prevent body scroll if content fits */
            /* Use the image as a background */
            background-image: url('./landingPageBg.png');
            background-size: cover; /* Cover the entire viewport */
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Keep background static */
            position: relative;
        }

        /* Overlay to darken the background image slightly for better text contrast */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.65); /* Dark semi-transparent overlay */
            z-index: -1; /* Place behind content */
        }

        /* Main Content Container */
        .container {
            max-width: 900px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2); /* Slight transparent background for content block */
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.5); /* Neon glow effect */
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Heading Styles */
        h1 {
            font-size: 3em;
            margin-bottom: 0.1em;
            color: #00ffc8; /* Bright cyan/green */
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.8);
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.5em;
            margin-top: 0;
            color: #b3f0ff;
            font-weight: 300;
        }

        /* Call to Action (CTA) Button */
        .cta-button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: none;
            color: #000000;
            background-color: #00ffc8;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffc8;
        }

        .cta-button:hover {
            background-color: #92ffe6;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px #00ffc8;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            h2 {
                font-size: 1.2em;
            }
            .cta-button {
                font-size: 1em;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DOCRUSH</h1>
        <h2>AI-Powered Patient Engagement</h2>
        <p>The Future of Healthcare, Simplified.</p>

        <a href="./demo.html" class="cta-button">
           start demo now
        </a>
    </div>

</body>
</html>
